resolver 127.0.0.11 valid=10s;
resolver_timeout 5s;

server {
    listen 80;
    server_name _;

    # Increase timeouts for long-running LLM requests
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    # Hide the nginx version from error pages / Server header for a bit less
    # fingerprinting surface. Cloudflare strips this header upstream too, but
    # belt-and-suspenders.
    server_tokens off;

    # Security headers for the static client. The Express server sets the
    # same headers (via helmet) on its own responses; these here cover the
    # SPA index.html and static assets served directly by nginx.
    # `always` makes nginx attach them even on non-2xx responses.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # CSP as an HTTP header (defence-in-depth alongside the meta tag in index.html).
    # Must stay in sync with: client/index.html and server/src/index.js (helmet).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $upstream http://server:5000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Match the Express largeBody limit so nginx doesn't reject story saves
        # before they reach Express. Default nginx limit is 1MB which is too small
        # for story payloads containing full Lexical editor state across all sections.
        client_max_body_size 10m;

        # Disable buffering for streaming endpoints (SSE on /api/suggest).
        proxy_buffering off;
    }
}
